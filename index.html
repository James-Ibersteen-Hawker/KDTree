<!doctype html>
<html>
  <head>
    <title>NTree</title>
  </head>
  <body>
    <p id="test"></p>
    <script type="module">
      import { KDTree } from "./kdtree.js";
      import { testSet } from "./data.js";
      try {
        const tree = new KDTree(testSet);
        document.getElementById("test").textContent = tree.tree;
      } catch (err) {
        alert(err);
      }
    </script>
  </body>
</html>
