<!doctype html>
<html>
  <head>
    <title>NTree</title>
  </head>
  <body style="color: white; background: black;">
    <p id="test"></p>
    <script type="module">
      import { KDTree } from "./kdtree.js";
      import { testSet } from "./data.js";
      const tree = new KDTree(testSet);
      const q = [0,0,0];
      try {
        const result = tree.search(q)
        alert(result);
      } catch (err) {
        alert(err);
      }
    </script>
  </body>
</html>
